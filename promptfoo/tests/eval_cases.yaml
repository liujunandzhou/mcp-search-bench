# ===== 跨域意图 =====
- description: "跨域 - 表格数据发消息"
  vars:
    query: "在多维表格里新建一条记录，然后发消息通知群里的人"
    candidates: |
      1. bitable.v1.appTableRecord.create: 新增记录
      2. im.v1.message.create: 发送消息
      3. bitable.v1.appTableRecord.list: 列出记录
      4. im.v1.chat.list: 获取群列表
      5. cardkit.v1.card.create: 创建卡片
  assert:
    - type: javascript
      value: |
        const result = JSON.parse(output);
        return Array.isArray(result)
          && result.includes('bitable.v1.appTableRecord.create')
          && result.includes('im.v1.message.create');

- description: "跨域 - 审批+日程"

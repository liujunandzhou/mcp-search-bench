      3. approval.v4.task.list: 获取审批任务列表
      4. calendar.v4.calendarEvent.list: 获取日程列表
      5. im.v1.message.create: 发送消息
  assert:
    - type: javascript
      value: |
        const result = JSON.parse(output);
        return Array.isArray(result)
          && result.includes('approval.v4.instance.get')
          && result.includes('calendar.v4.calendarEvent.create');

- description: "跨域 - 群聊+卡片"

# 飞书 MCP 工具搜索评测用例
# 每个 test case 包含用户查询、变量和期望匹配的工具

# ===== 精确意图 =====
- description: "精确意图 - 创建多维表格记录"
  vars:
    query: "创建一个多维表格记录"
    candidates: |
      1. bitable.v1.appTableRecord.create: 新增记录
      2. bitable.v1.appTableRecord.batchCreate: 批量新增记录
      3. bitable.v1.appTable.create: 新增数据表
      4. bitable.v1.app.create: 创建多维表格
      5. sheets.v3.spreadsheetSheet.write: 写入数据
  assert:
    - type: javascript
      value: |
        const result = JSON.parse(output);
        return Array.isArray(result) && result.includes('bitable.v1.appTableRecord.create');

